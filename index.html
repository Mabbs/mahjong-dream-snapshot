<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Access-Control-Allow-Origin" content="*">
  <meta http-equiv="x-rim-auto-match" content="none">
  <meta name="format-detection" content="telephone=yes">
  <meta name="screen-orientation" content="true">
  <meta name="format-detection" content="telephone=no">
  <meta name="full-screen" content="yes">
  <meta name="x5-fullscreen" content="true">
  <meta name="360-fullscreen" content="true">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="x5-page-mode" content="app">
  <meta name="browsermode" content="application">
  <title>Unity WebGL Player | 激情麻将</title>
  <style>
    html, body, div, span, applet, object, iframe, h1, h2, h3, h4, h5, h6, p, blockquote, pre, a, abbr, acronym, address, big, cite, code, del, dfn, em, img, ins, kbd, q, s, samp, small, strike, strong, sub, sup, tt, var, b, u, i, center, dl, dt, dd, ol, ul, li, fieldset, form, label, legend, table, caption, tbody, tfoot, thead, tr, th, td, article, aside, canvas, details, embed, figure, figcaption, footer, header, hgroup, menu, nav, output, ruby, section, summary, time, mark, audio, video,button{margin:0;padding:0;font-style: normal;}
    /*禁止浏览器修改字体大小*/
    html{font-size: 12px;}
    html body{
      -webkit-text-size-adjust: none !important;
      -moz-text-size-adjust: none !important;
      -ms-text-size-adjust: none !important;
      text-size-adjust: none !important;
    }
    a{text-decoration: none;}
    a:hover,a:active,a:visited,a:link,a:focus{
      -webkit-tap-highlight-color:rgba(0,0,0,0);
      -webkit-tap-highlight-color: transparent;
      outline:none;
    }
    body,html{height: 100%; overflow:hidden;position: relative;top: 0px;left:0px;background-color: black;margin:0;padding:0;}
    .landscape-screen{
      transform-origin: top left;
      transform: rotate(90deg) translateY(-100%)
    }
    /* 设置 iframe 和嵌套元素的背景色为黑色 */
    iframe {
      background-color: black;  /* 确保 iframe 也有黑色背景 */
    }
    #Frame {
      border-style: unset;
      display: block
    }
  </style>
</head>
<body>
<iframe id="Frame"></iframe>
<script>
  var orientation = window.orientation;

  //开始时调用
  var Frame = document.getElementById("Frame");

  var setOrientation = 1

  Frame.src = "game.html?undefined";

  function unityRefreshOrientation(){
    document.body.offsetHeight;
    var isInPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(setOrientation == 2 || !isInPhone){
      Frame.height = window.innerHeight;
      Frame.width = window.innerWidth;

      if(Frame.classList.contains("landscape-screen")){
        Frame.classList.remove("landscape-screen");
      }
      return;
    }
    if (window.matchMedia('(orientation: portrait)').matches) {
      console.log("当前是竖屏");
      Frame.height = window.innerWidth;
      Frame.width = window.innerHeight;

      console.log("index size ", window.innerHeight, ":", window.innerHeight);

      //通过css样式旋转90度
      Frame.classList.add("landscape-screen");
    } else {
      console.log("当前是横屏");
      Frame.height = window.innerHeight;
      Frame.width = window.innerWidth;

      //通过移除类去掉css样式
      Frame.classList.remove("landscape-screen");
    }
  };

  unityRefreshOrientation()

  Frame.addEventListener('load', function() {
    // 确保 iframe 加载完成后再发送消息
    Frame.contentWindow.postMessage('refreshMethod', '*');
    unityRefreshOrientation()
  });

  window.addEventListener('resize', function () {
    setTimeout(function() {
      console.log("等待结束，执行后续操作！");
      // 这里可以放置需要执行的代码
      Frame.contentWindow.postMessage('refreshMethod', '*');

      unityRefreshOrientation()
    }, 300);
    
  });

  window.addEventListener('message', function(event) {
    const data = event.data; // 获取子页面传递的参数

    if (data && data.action === 'receiveOrientationFromUnity') {
      console.log('接收到子页面的数据 Received from Unity:', data.value);  // 处理接收到的数据
      setOrientation = data.value;
      Frame.contentWindow.postMessage('refreshMethod', '*');
      unityRefreshOrientation()
    }
    else
    {
      console.log('接收到子页面的数据 event origin:', event.origin);  // 处理接收到的数据
      console.log('接收到子页面的数据 event data:', event.data);  // 处理接收到的数据
      var obj = null;
      try{
        obj = JSON.parse(event.data);
      }
      catch(e){
        console.log('JSON.parse error ',e);
      }

      if(obj && (obj.func == 'Event_Channel_Pay'
        || obj.func == "Event_Channel_Login"
        || obj.func == "Event_Channel_LogOut")) {
        console.log('trigger postMessage ');
        window.parent.postMessage(data, '*');
      }
    }
  });
</script>
</body>
</html>
